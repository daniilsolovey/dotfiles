threads: 12

picker:
  - fzf
  - --no-sort
  - --no-exact
  - --no-scrollbar
  - --pointer= 
  # - --color=bg+:50,fg+:17,hl+:17,gutter:-1,pointer:-1
  - --color=bg+:214,fg+:16,hl:178,hl+:16

votes_path: ~/.config/favor/votes.db

ignore_global:
  - .git
  - vendor

trees:
  - name: go
    dir: ~/go/src/
    min_depth: 2
    max_depth: 4

  - name: github
    dir: ~/github/
    min_depth: 1
    max_depth: 2

  - name: gitlab
    dir: ~/gitlab/
    min_depth: 1
    max_depth: 2

  - name: Python
    dir: ~/Python/
    min_depth: 1
    max_depth: 2


